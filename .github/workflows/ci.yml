name: VLM Serving Platform CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install websockets fastapi httpx uvicorn pillow pydantic

      - name: Run Platform Tests (Phase 1, 2, 3, 4, 5)
        run: |
          python -m unittest discover -s tests -v

      - name: Run Phase 0 Regression Tests
        run: |
          python -m unittest discover -s vlm_phase0/tests -v
          python -m unittest discover -s vlm_phase0/kaggle_vietnamese_ocr/tests -v

      - name: Run Phase 4 Ablation Pipeline Verification
        run: |
          python -m evaluation.ablation_runner --reports-dir reports

      - name: Build Gateway Docker Image
        run: |
          docker build -t vlm-gateway:ci -f infra/docker/Dockerfile.gateway .
