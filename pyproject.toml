[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-serving-platform"
version = "0.1.0"
description = "Vision-Language Model Serving & Evaluation Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pillow>=10.0.0",
    "httpx>=0.24.0",
    "requests>=2.28.0",
    "websockets>=11.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "huggingface-hub>=0.20.0",
]
test = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "client*"]
